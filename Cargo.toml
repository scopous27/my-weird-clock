[package]
name = "weird-ass-wall-clock-screensaver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "weird-clock"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
